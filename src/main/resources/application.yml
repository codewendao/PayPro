server:
  port: ${SERVER_PORT:8889}

spring:
  profiles:
    active: local
  mail:
    host: smtp.163.com #邮箱服务器
    password: ${MAIL_PASSWORD:xxxx} # 请确保此为正确的授权码
    port: 25
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "smtp.163.com"  # 信任指定主机
    username: codewendao@163.com #发送邮箱的账号

  output:
    ansi:
      enabled: DETECT
  thymeleaf:
    cache: false
    enabled: true
    mode: LEGACYHTML5
  datasource:
    driverClassName: com.mysql.jdbc.Driver
    filters: stat,wall,log4j
    initialSize: 5
    maxActive: 20
    maxPoolPreparedStatementPerConnectionSize: 20
    maxWait: 60000
    minEvictableIdleTimeMillis: 300000
    minIdle: 5
    password: ${DB_PASSWORD:Frfr46467979+}
    poolPreparedStatements: true
    testOnBorrow: false
    testOnReturn: false
    testWhileIdle: true
    timeBetweenEvictionRunsMillis: 60000
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://81.71.9.142:27887/pay-test?useSSL=false&characterEncoding=utf-8&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    validationQuery: SELECT 1 FROM DUAL
  redis:
    database: ${REDIS_DB:1}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    pool:
      max-active: -1
      max-idle: 8
      max-wait: -1
      min-idle: 0
    timeout: 10000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      update-strategy: NOT_EMPTY
      #逻辑删除字段
      logic-delete-field: delFlag
      #删除值
      logic-delete-value: 1
      #未删除值
      logic-not-delete-value: 0

paypro:
  alipayCustomQrUrl: https://qr.alipay.com/fkx17492eze99maemka1u81
  alipayUserId: 2088122989840531
  indexTitle: PayPro个人收款系统 # 网站首页标题
  name: codewendao # 支付宝免备注昵称
  title: PayPro个人收款系统 # 邮件标题
  site: ${SITE_URL:http://localhost:8889} # 生成邮件里操作的url地址和支付宝免备注需要
  qr-dir: /app/appsystems/qr
  mobile: xxxxxx # 支付宝免备注需要，填写你支付宝的手机号
  email:
    receiver: xxxx@qq.com
    sender: xxxx@163.com
  rateLimit:
    # 防炸库缓存验证(分钟)
    ipExpire: 2
  token:
    value: 123
    expire: 14
  qrCodeNum: 2
  decrement:
    enabled: true
    maxCount: 2
    step: 0.01
  openapi:
    secret: your_openapi_secret_key_here
  payMethods:
    - id: 'alipay'
      name: '支付宝支付'
      description: '免输备注，手动收款'
      icon: '🔵'
      status: true
      allow-night: false
      use-local-qr-code: false
    - id: 'wechat'
      name: '微信支付'
      description: '需备注，自动确认收款'
      icon: '🟢'
      status: true
      allow-night: true
      use-local-qr-code: true
    - id: 'wechat_zs'
      name: '微信赞赏码支付'
      description: '需备注，自动确认收款'
      icon: '🟢'
      status: true
      allow-night: false
      use-local-qr-code: true
    - id: 'alipay_dmf'
      name: '支付宝当面付'
      description: '支付宝官方产品，无需营业执照，免备注自动收款'
      icon: '🔵'
      status: true
      allow-night: true
      use-local-qr-code: false